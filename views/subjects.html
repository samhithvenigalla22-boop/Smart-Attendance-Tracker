<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjects - Smart Attendance Tracker</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/style.css?v=2.1">
  <link rel="stylesheet" href="../css/subjects.css?v=2.1">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">✓</div>
          <div>
            <div class="brand-title">Smart Attendance</div>
            <div class="brand-subtitle">Tracker</div>
          </div>
        </a>
      </div>
      <ul class="nav-menu">
        <li class="nav-item"><a href="index.html"><span class="nav-icon">📊</span>Dashboard</a></li>
        <li class="nav-item"><a href="student.html"><span class="nav-icon">👤</span>Student Profile</a></li>
        <li class="nav-item active"><a href="subjects.html"><span class="nav-icon">📚</span>Subjects</a></li>
        <li class="nav-item"><a href="attendance.html"><span class="nav-icon">📝</span>Mark Attendance</a></li>
        <li class="nav-item"><a href="history.html"><span class="nav-icon">🕒</span>Attendance Summary</a></li>
        <li class="nav-item"><a href="planner.html"><span class="nav-icon">🎯</span>Planner & Simulator</a></li>
        <li class="nav-item"><a href="timetable.html"><span class="nav-icon">📅</span>Timetable</a></li>
        <li class="nav-item"><a href="reports.html"><span class="nav-icon">📄</span>Reports</a></li>
      </ul>
      <div class="sidebar-footer">
        <div>College Attendance Portal</div>
        <div style="font-size: 11px; opacity: 0.8; margin-top: 2px;">Vanilla JS + Axios + JSON Server</div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Navigation">☰</button>
          <h1 class="page-title">Subject Management</h1>
        </div>
        <div class="topbar-right">
          <div class="student-selector-wrap">
            <label for="global-student-select">Active Student:</label>
            <select id="global-student-select" class="student-select" aria-label="Select active student"></select>
          </div>
        </div>
      </header>

      <main class="content-area">
        <!-- Controls: Search, Filter, Add Subject -->
        <div class="controls-bar">
          <div class="search-filter-group">
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input type="text" id="subject-search" class="search-input" placeholder="Search by subject name or code...">
            </div>
            <select id="subject-status-filter" class="filter-select">
              <option value="ALL">All Subjects</option>
              <option value="SAFE">Safe Status (≥ Target)</option>
              <option value="SHORTAGE">Shortage Warning (< Target)</option>
            </select>
          </div>
          <button class="btn btn-primary" id="btn-add-subject">+ Add New Subject</button>
        </div>

        <!-- Subjects Grid Display -->
        <div class="subjects-grid" id="subjects-grid">
          <!-- Dynamically populated via subjects.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Subject Add / Edit Modal -->
  <div class="modal-backdrop" id="subject-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="subject-modal-title">Add Subject</h3>
        <button class="modal-close" id="subject-modal-close">&times;</button>
      </div>
      <form id="subject-form">
        <div class="modal-body">
          <input type="hidden" id="subject-id">

          <div class="form-group">
            <label class="form-label" for="subject-name">Subject Name <span class="required">*</span></label>
            <input type="text" id="subject-name" class="form-control" placeholder="e.g. Data Structures & Algorithms" required>
            <div class="invalid-feedback" id="err-subjectName"></div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="subject-code">Subject Code <span class="required">*</span></label>
              <input type="text" id="subject-code" class="form-control" placeholder="e.g. CS301" required>
              <div class="invalid-feedback" id="err-subjectCode"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="subject-faculty">Faculty Name</label>
              <input type="text" id="subject-faculty" class="form-control" placeholder="e.g. Prof. Rajesh Sharma">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="subject-target">Target Attendance (%) <span class="required">*</span></label>
              <input type="number" id="subject-target" class="form-control" value="75" min="1" max="100" required>
              <div class="invalid-feedback" id="err-targetAttendance"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="subject-credits">Credits</label>
              <input type="number" id="subject-credits" class="form-control" value="4" min="0" max="10">
              <div class="invalid-feedback" id="err-credits"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="subject-classes-per-week">Classes / Week</label>
              <input type="number" id="subject-classes-per-week" class="form-control" value="4" min="1" max="20">
              <div class="invalid-feedback" id="err-classesPerWeek"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btn-cancel-subject">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-subject">Save Subject</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script type="module" src="../js/subjects.js?v=2.1"></script>
</body>
</html>
